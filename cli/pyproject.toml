[project]
name = "umm-cli"
version = "0.1.0"
description = "Command line for the umm memory app"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
umm = "umm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["umm.py"]
